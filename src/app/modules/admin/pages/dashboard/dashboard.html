<div class="admin-panel" style="padding: 2rem; max-width: 800px; margin: auto; color: white;">
  <header style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
    <h1>🚀 Panel de Administración</h1>
    <button (click)="logout()" style="background: #ff4444; border: none; padding: 10px; color: white; cursor: pointer;">Cerrar Sesión</button>
  </header>

  <section class="form-card" style="background: #1e293b; padding: 2rem; border-radius: 12px;">
    <h2>Publicar Nueva Noticia</h2>
    
    <div style="margin-bottom: 1rem;">
      <label>Título:</label><br>
      <input type="text" [(ngModel)]="nuevaNoticia.titulo" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label>Categoría:</label><br>
      <select [(ngModel)]="nuevaNoticia.tag" style="width: 100%; padding: 8px; margin-top: 5px;">
        <option value="IA">Inteligencia Artificial</option>
        <option value="Web">Desarrollo Web</option>
        <option value="Hardware">Hardware</option>
      </select>
    </div>

    <div style="margin-bottom: 1rem;">
      <label>Resumen:</label><br>
      <textarea [(ngModel)]="nuevaNoticia.resumen" rows="4" style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
    </div>

    <button (click)="publicar()" style="background: #38bdf8; width: 100%; padding: 12px; border: none; font-weight: bold; cursor: pointer;">
      POSTEAR AHORA
    </button>
  </section>
</div>
