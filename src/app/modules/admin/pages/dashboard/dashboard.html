<div class="admin-layout">
  <header class="admin-header">
    <div class="logo">🚀 TechPortal <span>Admin</span></div>
    <button type="button" (click)="logout()" class="btn-logout">Cerrar Sesión</button>
  </header>

  <main class="dashboard-grid">
    <section class="form-card">
      <h2>Publicar Nueva Noticia</h2>

      <form (ngSubmit)="postear()">  
        <div class="form-group">
          <label for="titulo">Título de la noticia</label>
          <input id="titulo" type="text" [(ngModel)]="titulo" name="titulo" required placeholder="Ej: Nueva IA en 2026">
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" [(ngModel)]="tag" name="tag">
            <option value="IA">Inteligencia Artificial</option>
            <option value="Web">Desarrollo Web</option>
            <option value="Hardware">Hardware</option>
            <option value="loT">Internet de las Cosas</option>
            <option value="TIC">Tecnología de la Información y Comunicaciones</option>
          </select>
        </div>

        <div class="form-group">
          <label for="resumen">Resumen del contenido</label>
          <textarea id="resumen" [(ngModel)]="resumen" name="resumen" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn-primary">POSTEAR AHORA</button>
      </form>
    </section>
  </main>
</div>
