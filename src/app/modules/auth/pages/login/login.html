<div class="login-container" [class.user-mode]="loginMode === 'user'">

  <!-- PANEL IZQUIERDO -->
  <div class="side-panel">
    <h2>{{ loginMode === 'admin' ? 'Welcome Back!' : 'Welcome!' }}</h2>
    <p>
      Estamos felices de tenerte aquí.  
      Si necesitas ayuda, estamos para apoyarte.
    </p>

    <button class="switch-btn" (click)="cambiarModo()">
      {{ loginMode === 'admin' ? 'Sign Up ' : 'Sign In ' }}
    </button>
  </div>

  <!-- PANEL DERECHO -->
  <div class="form-panel">

    <h1>{{ loginMode === 'admin' ? 'Administrador' : 'Usuario' }}</h1>

    <div class="input-group">
      <label>Usuario</label>
      <input type="text" [(ngModel)]="username" placeholder="Ej: admin o usuario">
    </div>

    <div class="input-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••">
    </div>

    <button class="btn-login" (click)="login()">
      {{ loginMode === 'admin' ? 'Iniciar como Admin' : 'Iniciar como Usuario' }}
    </button>

    <p class="error-msg" *ngIf="error()">
      {{ error() }}
    </p>

  </div>

</div>
